name: CI

# Two jobs, split by cache key rather than by package. The contracts job needs solc and Hardhat's
# artifacts; everything else needs the pnpm store. Splitting them keeps one from waiting on the
# other's cache.
#
# The test steps are red on purpose right now. Every package ships the first real test taken from
# the specification, and those tests stay failing until the tickets in `docs/scratch/build/` implement
# what they describe. Red here means "not written yet", not "broken".

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # onchain is a workspace member but belongs to the contracts job, which owns the solc cache.
      - run: pnpm --recursive --filter '!@perdiem/onchain' --if-present typecheck
      - run: pnpm --recursive --filter '!@perdiem/onchain' --if-present lint
      - run: pnpm --recursive --filter '!@perdiem/onchain' --if-present test

      # workflow-cre/ is deliberately outside the workspace: the Chainlink CRE CLI owns its manifest.
      - run: pnpm --dir workflow-cre install --frozen-lockfile
      - run: pnpm --dir workflow-cre typecheck
      - run: pnpm --dir workflow-cre test

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --dir onchain build
      - run: pnpm --dir onchain test
