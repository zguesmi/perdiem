# The stack against Arc testnet. `docker compose -f docker-compose.arc.yml up --build`.
#
# A separate file rather than an override of `docker-compose.yml`, because an override cannot
# remove: there is no node and nothing to deploy here. `SEALED_AUCTION_ADDRESS` in `.env.arcTestnet`
# names a contract that is already on chain.
#
# The `caddy` service is the public interface. Every other port is published on loopback, so the
# proxy is the only way in. It terminates TLS for `PUBLIC_HOST`, which `.env` names, and routes by
# path: `/` to the page, `/relay/*` to the relay, `/purchaser/*` to the purchaser service.
#
# The environment file names that host back to the services that need it: `RELAY_URL` and
# `PURCHASER_URL`, which a browser resolves, `PAGE_ORIGIN`, the only origin the purchaser answers,
# and `UI_ALLOWED_HOSTS`, which is the `Host` header Vite accepts.
#
# Not here: the CRE workflow, which needs the `cre` binary.

name: perdiem-arc

x-environment-file: &environment-file
  type: bind
  source: ./.env.arcTestnet
  target: /app/.env.arcTestnet
  read_only: true

# Compose attaches a pipe rather than a TTY, and `shared/log.ts` drops its colour on a pipe.
x-environment: &environment
  ENV_FILE: /app/.env.arcTestnet
  FORCE_COLOR: "1"

# The Circle CLI session, opened on the host with `circle wallet login <email> --testnet`. Writable,
# because the CLI refreshes it in place.
x-circle-session: &circle-session
  type: bind
  source: ${HOME}/.circle-cli
  target: /root/.circle-cli

# One wallet each: `commit` is once per address, so two agents behind one wallet place one
# commitment and revert the other. They poll five times slower than the default, because Arc's
# public endpoint answers three agents polling every second with `rate limit exceeded`.
x-supplier: &supplier
  build:
    context: .
    dockerfile: supplier/Dockerfile
  image: perdiem/supplier
  depends_on:
    relay:
      condition: service_healthy
  volumes:
    - *environment-file
    - *circle-session

# One start delay per agent, because all three wake on the same log and Circle caps a developer
# entity at five POST requests a second. One `wallet execute` spends several of them.
x-supplier-environment: &supplier-environment
  <<: *environment
  RELAY_URL: http://relay:8787
  WATCH_POLL_MILLISECONDS: 5000

services:
  relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    image: perdiem/relay
    environment: *environment
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - *environment-file
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/auctions/0x0/bids').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  purchaser:
    build:
      context: .
      dockerfile: purchaser/Dockerfile
    image: perdiem/purchaser
    depends_on:
      relay:
        condition: service_healthy
    environment:
      <<: *environment
      RELAY_URL: http://relay:8787
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - *environment-file

  supplier-astoria:
    <<: *supplier
    environment:
      <<: *supplier-environment
      AGENT_WALLET_VARIABLE: SUPPLIER_1_WALLET_ADDRESS
      BID_START_DELAY_MILLISECONDS: 0
    command: ["pnpm", "--filter", "@perdiem/supplier", "start", "hotel-astoria-agent"]

  supplier-victoria:
    <<: *supplier
    environment:
      <<: *supplier-environment
      AGENT_WALLET_VARIABLE: SUPPLIER_2_WALLET_ADDRESS
      BID_START_DELAY_MILLISECONDS: 2000
    command: ["pnpm", "--filter", "@perdiem/supplier", "start", "victoria-palace-agent"]

  supplier-voyageurs:
    <<: *supplier
    environment:
      <<: *supplier-environment
      AGENT_WALLET_VARIABLE: SUPPLIER_3_WALLET_ADDRESS
      BID_START_DELAY_MILLISECONDS: 4000
    command: ["pnpm", "--filter", "@perdiem/supplier", "start", "dame-des-arts-agent"]

  # Vite refuses a request whose `Host` header it does not know, so a public deployment names its
  # own host in `UI_ALLOWED_HOSTS`.
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: perdiem/ui
    environment: *environment
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - *environment-file

  # The only container that answers the public interface. Everything else is published on loopback,
  # so nothing is reachable except through here. It terminates TLS for `PUBLIC_HOST` and routes by
  # path; `Caddyfile` holds the routes.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - ui
      - relay
      - purchaser
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      ACME_CA: ${ACME_CA-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      # The issued certificate. A named volume, because a rebuild that loses it asks Let's Encrypt
      # for another one against a shared rate limit.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
