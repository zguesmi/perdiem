packages:
  - "packages/*"
  - "onchain"
  - "requisition"
  - "relay"
  - "agents"
  - "web"

# workflow/ is deliberately absent. The Chainlink CRE CLI generates and regenerates its own
# package.json, and a workspace member it does not know about is a member it will overwrite.
# It reaches packages/core through a file: dependency instead. Revisit once the CLI's behaviour
# is verified.
# pnpm refuses to run a dependency's install scripts unless it is allowed here.
# esbuild is pulled in by tsx, the loader that runs node:test over TypeScript.
allowBuilds:
  # bufferutil and utf-8-validate are optional native speedups for ws, pulled in by the Circle CLI.
  # The CLI runs without them.
  bufferutil: false
  esbuild: true
  utf-8-validate: false

# pnpm holds back packages published very recently. Hardhat 3.16.0 is newer than that threshold and
# is the version the project is pinned to, so it is excluded from the hold.
minimumReleaseAgeExclude:
  - hardhat@3.16.0

storeDir: .pnpm-store
cacheDir: .pnpm-cache
