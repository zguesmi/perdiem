packages:
  - "packages/*"
  - "onchain"
  - "requisition"
  - "relay"
  - "agents"
  - "web"

# workflow/ is deliberately absent. The Chainlink CRE CLI generates and regenerates its own
# package.json, and a workspace member it does not know about is a member it will overwrite.
# It reaches packages/core through a file: dependency instead. Revisit once the CLI's behaviour
# is verified.
